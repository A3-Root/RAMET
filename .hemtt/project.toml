name = "root_amet"
prefix = "root_amet"
mainprefix = "z"
author = "Root"
folder_optionals = false

[version]
git_hash = 0

[files]
include = [
    "mod.cpp",
    "README*.md",
    "LICENSE",
    "ramet_logo.paa",
    "release.ps1",
    "release.sh",
    "grad_meh_x64.dll",
    "ocap_exporter_x64.dll",
    "MapExportExtension_x64.dll",
    "intercept_x64.dll",
    "vendor/intercept/intercept_x64.dll",

    # Include the source-build manifest and hook in the release package.
    ".hemtt/project.toml",
    ".hemtt/hooks/post_build/**",
    "include/**",
    "modules/$FLATDEVIL$",

    # grad_meh source and build metadata. Generated build/install directories are deliberately not included.
    "subprojects/grad_meh/.gitmodules",
    "subprojects/grad_meh/CMakeLists.txt",
    "subprojects/grad_meh/CMakePresets.json",
    "subprojects/grad_meh/CMakeUserPresets.json",
    "subprojects/grad_meh/LICENSE",
    "subprojects/grad_meh/ci-conan-profile",
    "subprojects/grad_meh/conan.lock",
    "subprojects/grad_meh/conanfile.py",
    "subprojects/grad_meh/rust-cxx.natvis",
    "subprojects/grad_meh/cmake/**",
    "subprojects/grad_meh/docs/**",
    "subprojects/grad_meh/gdal/**",
    "subprojects/grad_meh/intercept/**",
    "subprojects/grad_meh/src/**",
    "subprojects/grad_meh/tools/**",

    # arma3MapExporter source. The generated publish directory is excluded; the post_build hook stages its DLL when one exists.
    "subprojects/arma3MapExporter/.gitmodules",
    "subprojects/arma3MapExporter/LICENSE",
    "subprojects/arma3MapExporter/MapExportExtension.sln",
    "subprojects/arma3MapExporter/build.ps1",
    "subprojects/arma3MapExporter/build-release.ps1",
    "subprojects/arma3MapExporter/workshop-publish.ps1",
    "subprojects/arma3MapExporter/MapExportExtension/ArmaSerializer.cs",
    "subprojects/arma3MapExporter/MapExportExtension/Extension.cs",
    "subprojects/arma3MapExporter/MapExportExtension/MapExportExtension.csproj",
    "subprojects/arma3MapExporter/MapExportExtension/MapExportSession.cs",
    "subprojects/arma3MapExporter/MapExportExtension/PackageImage.cs",
    "subprojects/arma3MapExporter/MapExportExtension/PackageIndex.cs",
    "subprojects/arma3MapExporter/MapExportExtension/PackageIndexContext.cs",
    "subprojects/arma3MapExporter/MapExportExtension/PackageLocation.cs",
    "subprojects/arma3MapExporter/MapExportExtension/ScreenShotTileMetrics.cs",
    "subprojects/arma3MapExporter/MapExportExtension/Worker.cs",
    "subprojects/arma3MapExporter/MapExportLauncher/*.cs",
    "subprojects/arma3MapExporter/MapExportLauncher/data/**",
    "subprojects/arma3MapExporter/extern/**",

    # OCAP source and renderer context. Reference data is not release content.
    "subprojects/ocap-renderterrain/LICENSE",
    "subprojects/ocap-renderterrain/build.cmd",
    "subprojects/ocap-renderterrain/ocap_renderterrain_process.bat",
    "subprojects/ocap-renderterrain/ocap_renderterrain_process.sh",
    "subprojects/ocap-renderterrain/ocap-exporter/RVExtension.c",
    "subprojects/ocap-renderterrain/ocap-exporter/build.bat",
    "subprojects/ocap-renderterrain/ocap-exporter/build.sh",
    "subprojects/ocap-renderterrain/ocap-exporter/export_data.sqf",
    "subprojects/ocap-renderterrain/ocap-exporter/extensionCallback.h",
    "subprojects/ocap-renderterrain/ocap-exporter/go.mod",
    "subprojects/ocap-renderterrain/ocap-exporter/ocap_exporter.go",
    "subprojects/ocap-renderterrain/ocap-exporter/ocap_exporter_x64.dll",
    "subprojects/ocap-renderterrain/ocap-exporter/ocap_exporter_x64.h",
    "subprojects/ocap-renderterrain/ocap-renderterrain/Dockerfile",
    "subprojects/ocap-renderterrain/ocap-renderterrain/app.py",
    "subprojects/ocap-renderterrain/ocap-renderterrain/im-policy.xml",
    "subprojects/ocap-renderterrain/ocap-renderterrain/modules/**",
    "subprojects/ocap-renderterrain/ocap-renderterrain/requirements.txt",
    "subprojects/ocap-renderterrain/tools/**"
]
exclude = [
    ".gitignore",
    ".editorconfig",
    "*.md",
    "*.json",
    "subprojects/**/build/**/*",
    "subprojects/**/install/**/*",
    "subprojects/grad_meh/build/**/*",
    "subprojects/grad_meh/install/**/*",
    "subprojects/arma3MapExporter/build/**/*",
    "subprojects/arma3MapExporter/publish/**/*",
    "subprojects/ocap-renderterrain/ocap-exporter/build/**/*",
    "subprojects/ocap-renderterrain/ocap-renderterrain/build/**/*",
    "**/bin/**/*",
    "**/obj/**/*",
    "**/__pycache__/**/*",
    "**/.vs/**/*",
    "*.pdb",
    "*.obj",
    "*.pyc",
    "*.pyo",
    "*.ilk"
]
